<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">MyShop</div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="auth-buttons">
            <button>Login</button>
            <button>Register</button>
        </div>
    </header>

    <!-- Product Grid -->
    <section class="products">

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Áo Thun Nam</h3>
            <p>199.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Quần Jean</h3>
            <p>399.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Giày Sneaker</h3>
            <p>599.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Túi Xách</h3>
            <p>299.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Đồng Hồ</h3>
            <p>799.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Kính Mát</h3>
            <p>259.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Áo Khoác</h3>
            <p>499.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300x180" alt="Product">
            <h3>Balo</h3>
            <p>349.000đ</p>
            <button class="buy-btn">Mua</button>
        </div>

    </section>

</body>
</html>
