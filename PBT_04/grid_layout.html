<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

<div class="layout">

    <header class="header">
        <h1>MyShop</h1>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h2>SALE UP TO 50%</h2>
            <p>Mua sắm ngay hôm nay</p>
        </div>

        <!-- Bonus -->
        <div class="featured-product">
            <h3>Sản phẩm nổi bật</h3>
            <p>Giày Sneaker Premium</p>
        </div>
    </section>

    <aside class="sidebar">
        <h3>Bộ lọc</h3>

        <label><input type="checkbox"> Áo</label>
        <label><input type="checkbox"> Quần</label>
        <label><input type="checkbox"> Giày</label>
        <label><input type="checkbox"> Túi</label>
        <label><input type="checkbox"> Phụ kiện</label>
    </aside>

    <main class="main-content">

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Áo Thun</h4>
            <p>199.000đ</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Quần Jean</h4>
            <p>399.000đ</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Giày Sneaker</h4>
            <p>599.000đ</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Túi Xách</h4>
            <p>299.000đ</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Đồng Hồ</h4>
            <p>799.000đ</p>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/250x150">
            <h4>Kính Mát</h4>
            <p>259.000đ</p>
        </div>

    </main>

    <aside class="ads">
        <h3>Quảng cáo</h3>
        <img src="https://via.placeholder.com/180x400" alt="Ads">
    </aside>

    <footer class="footer">
        <p>© 2026 MyShop. All Rights Reserved.</p>
    </footer>

</div>

</body>
</html>
