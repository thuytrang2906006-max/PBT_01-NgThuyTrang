<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <h1>PHẦN 1: CONTENT-BOX VS BORDER-BOX</h1>

    <div class="box-container">
        <div class="box content-box">
            Hộp 1<br>
            content-box
        </div>

        <div class="box border-box">
            Hộp 2<br>
            border-box
        </div>
    </div>

    <hr>

    <h1>PHẦN 2: LAYOUT 3 CỘT</h1>

    <h2>Không dùng border-box</h2>

    <div class="container normal">
        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

        <div class="ads">
            Ads
        </div>
    </div>

    <h2>Dùng border-box</h2>

    <div class="container borderbox">
        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

        <div class="ads">
            Ads
        </div>
    </div>

</body>
</html>
